[project]
name = "onethread"
version = "0.1.0"
description = "One Thread demo backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]>=3.2",
    "pyyaml",
    "pydantic>=2",
    "anthropic",
    "sse-starlette",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onethread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
