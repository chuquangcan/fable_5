    kind: 4m_change
    category: Material
    title: "LOT-B accepted conditionally"
    reason: "IQC-5531 Cpk 0.92 < 1.33 (drawing D-12 p.7)"
    source: QMS
    acting: [purchasing, production]
    object_ids: [LOT-B, IQC-5531, SUP-S1]
    status: watching
    at: "2026-10-28T15:00:00+07:00"
  - notice_id: 4M-0002
    kind: 4m_change
    category: Material
    title: "HOP-1 material change LOT-A → LOT-B"
    reason: "Issue ISS-1103 at 13:52"
    source: WMS
    acting: [production, quality]
    object_ids: [HOP-1, LOT-B, M02]
    status: watching
    at: "2026-11-03T13:52:00+07:00"
  - notice_id: AL-0001
    kind: alert
    severity: P1
    title: "M02 cycle time 31 s → 42 s"
    reason: "Jump right after LOT-B was loaded into HOP-1 at 13:52; target 30 s"
    source: PLC2
    acting: [quality, maintenance]
    object_ids: [M02, LINE-1, LOT-B]
    status: watching
    at: "2026-11-03T14:00:00+07:00"

time_mappings:
