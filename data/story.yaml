    type: part
    name: "Bearing 6203"
    attributes: {stage: dinh_kem}
  - id: LOT-A
    type: lot
    name: LOT-A
    attributes: {stage: kho, part: BRG-6203, role: "đối chứng"}
  - id: LOT-B
    type: lot
    name: LOT-B
    attributes: {stage: kho, part: BRG-6203, qty: 5000, role: "nghi vấn"}
  - id: S1-6203-B
    type: supplier_lot
    name: S1-6203-B
    attributes: {stage: dinh_kem, supplier: SUP-S1}

  # --- Kho / mua hàng ---
  - id: RCV-1410
    type: receipt
    name: RCV-1410
    attributes: {stage: kho, lot: LOT-A}
  - id: RCV-2810
    type: receipt
    name: RCV-2810
    attributes: {stage: kho, lot: LOT-B, qty: 5000, received_at: "2026-10-28T09:10:00+07:00"}
  - id: PO-4410
    type: purchase_order
    name: PO-4410
    attributes: {stage: cung_ung, supplier: SUP-S1, qty: 5000}
  - id: PO-4380
    type: purchase_order
    name: PO-4380
    attributes: {stage: cung_ung, qty: 5000, supplier: SUP-S1}
  - id: SUP-S1
    type: supplier
    name: "Supplier S1"
    attributes: {stage: cung_ung, erp_code: NCC-S1}

  # --- Chất lượng ---
  - id: IQC-5507
    type: inspection
    name: IQC-5507
    attributes: {stage: dinh_kem, lot: LOT-A, cpk: 1.45, verdict: "Đạt", spec_min: 1.33}
  - id: IQC-5531
    type: inspection
    name: IQC-5531
    attributes: {stage: dinh_kem, lot: LOT-B, cpk: 0.92, verdict: "Chấp nhận có điều kiện", spec_min: 1.33}

  # --- Bán hàng / giao hàng ---
  - {id: SO-7781, type: sales_order, name: SO-7781, attributes: {stage: khach_hang}}
  - {id: SO-7790, type: sales_order, name: SO-7790, attributes: {stage: khach_hang}}
  - {id: CUS-C1, type: customer, name: "Customer C1", attributes: {stage: khach_hang}}
  - {id: CUS-C3, type: customer, name: "Customer C3", attributes: {stage: khach_hang}}
  - {id: CUS-C5, type: customer, name: "Customer C5", attributes: {stage: khach_hang}}
  - id: SHP-1112
    type: shipment
    name: SHP-1112
    attributes: {stage: logistics, status: delivered, date: "2026-11-12", customer: CUS-C3, parts: 400, boxes: 17}
  - id: SHP-1115
    type: shipment
