# One Thread demo — Story bible (nguồn sự thật: docs/superpowers/specs/2026-11-11-one-thread-demo-design.md, mục 3.1)
#
# Câu chuyện: bơm MH-20 serial MH20-0001, ép trên Machine 02 lúc 2026-11-03 14:05 (giờ nhà máy, UTC+7),
# giao khách C3 ngày 2026-11-12 (SHP-1112), bị khiếu nại kêu to (CLM-0012) ngày 2027-02-10.
# Nguyên nhân gốc: ổ bi Bearing 6203 LOT-B (nhập kho 2026-10-28 từ Supplier S1, IQC Cpk 0.92 < 1.33).
# LOT-B được nạp vào Hopper 1 lúc 13:52 → cycle time Machine 02 từ 31 s lên 42 s, lực ép +6%.
# Đã loại trừ: bảo trì PM-0241, vận hành NV-118, nhiệt độ ENV-L1.
# 1,000 serial dùng LOT-B → 42 thùng → 3 lô giao (SHP-1112/1115 đã tới khách, SHP-1120 còn trong kho).
#
# File này chỉ chứa phần viết tay (~30 object). 1,000 serial, 42 thùng, event máy ép và event phụ
# (bảo trì, ca, nhiệt độ, nhập kho RCV-2810, nạp lô ISS-1103) do seed/generate.py sinh.

