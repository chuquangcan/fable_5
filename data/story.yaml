  - id: CLM-0012
    type: claim
    name: CLM-0012
    attributes:
      stage: hau_mai
      status: open
      symptom: "Bơm kêu to bất thường khi chạy"
      customer: CUS-C3
      serial: MH20-0001
      received: "2027-02-10"
