# One Thread demo — Story bible (source of truth: docs/superpowers/specs/2026-11-11-one-thread-demo-design.md, section 3.1)
#
# Story: MH-20 pump serial MH20-0001, pressed on Machine 02 at 2026-11-03 14:05 (plant time, UTC+7),
# shipped to customer C3 on 2026-11-12 (SHP-1112), reported as noisy (CLM-0012) on 2027-02-10.
# Root cause: Bearing 6203 LOT-B (received 2026-10-28 from Supplier S1, IQC Cpk 0.92 < 1.33).
# LOT-B was loaded into Hopper 1 at 13:52 → Machine 02 cycle time rose from 31 s to 42 s, press force +6%.
# Ruled out: maintenance PM-0241, operator NV-118, temperature ENV-L1.
# 1,000 serials use LOT-B → 42 boxes → 3 shipments (SHP-1112/1115 reached customers, SHP-1120 is still in the warehouse).
#
# This file holds only the hand-written part (~30 objects). The 1,000 serials, 42 boxes, press-machine events and supporting events
# (maintenance, shift, temperature, goods receipt RCV-2810, lot load ISS-1103) are generated by seed/generate.py.

objects:
  # --- Claim ---
  - id: CLM-0012
    type: claim
    name: CLM-0012
    attributes:
      stage: hau_mai
      status: open
      symptom: "Pump is abnormally noisy when running"
      customer: CUS-C3
      serial: MH20-0001
      received: "2027-02-10"
  - id: CLM-0011
    type: claim
    name: CLM-0011
    attributes:
      stage: hau_mai
      status: open
      symptom: "Water leak"
      customer: CUS-C1
      serial: MH20-2457
      received: "2027-02-03"
  - id: CLM-0009
    type: claim
    name: CLM-0009
    attributes:
      stage: hau_mai
      status: closed
      symptom: "Bearing 6203 noise"
      period: "2026-09"
      resolution: "Increase IQC sampling from n=5 to n=20"

  # --- Production ---
  - {id: M01, type: machine, name: "Machine 01", attributes: {stage: san_xuat, cycle_target_s: 32, line: LINE-2}}
  - {id: M02, type: machine, name: "Machine 02", attributes: {stage: san_xuat, cycle_target_s: 30, line: LINE-1}}
  - {id: M03, type: machine, name: "Machine 03", attributes: {stage: san_xuat, cycle_target_s: 29, line: LINE-2}}
  - {id: HOP-1, type: hopper, name: "Hopper 1", attributes: {stage: san_xuat}}
  - {id: HOP-2, type: hopper, name: "Hopper 2", attributes: {stage: san_xuat}}
  - {id: LINE-1, type: line, name: "Line 1", attributes: {stage: san_xuat, product: MH-20}}
  - {id: LINE-2, type: line, name: "Line 2", attributes: {stage: san_xuat, product: MH-25}}

  # --- Components / lots ---
  - id: BRG-6203
    type: part
    name: "Bearing 6203"
    attributes: {stage: dinh_kem}
  - id: LOT-A
    type: lot
    name: LOT-A
    attributes: {stage: kho, part: BRG-6203, role: "control"}
  - id: LOT-B
    type: lot
    name: LOT-B
    attributes: {stage: kho, part: BRG-6203, qty: 5000, role: "suspect"}
  - id: BRG-6204
    type: part
    name: "Bearing 6204"
    attributes: {stage: dinh_kem}
  - id: LOT-C
    type: lot
    name: LOT-C
    attributes: {stage: kho, part: BRG-6204, qty: 4000}
  - id: S1-6203-B
    type: supplier_lot
    name: S1-6203-B
    attributes: {stage: dinh_kem, supplier: SUP-S1}

  # --- Warehouse / purchasing ---
  - id: RCV-1410
    type: receipt
    name: RCV-1410
    attributes: {stage: kho, lot: LOT-A}
  - id: RCV-2810
    type: receipt
    name: RCV-2810
    attributes: {stage: kho, lot: LOT-B, qty: 5000, received_at: "2026-10-28T09:10:00+07:00"}
  - id: PO-4410
    type: purchase_order
    name: PO-4410
    attributes: {stage: cung_ung, supplier: SUP-S1, qty: 5000}
  - id: PO-4380
    type: purchase_order
    name: PO-4380
    attributes: {stage: cung_ung, qty: 5000, supplier: SUP-S1}
  - id: SUP-S1
    type: supplier
    name: "Supplier S1"
    attributes: {stage: cung_ung, erp_code: SUPPLIER-S1}

  # --- Quality ---
  - id: IQC-5507
    type: inspection
    name: IQC-5507
    attributes: {stage: dinh_kem, lot: LOT-A, cpk: 1.45, verdict: "Pass", spec_min: 1.33}
  - id: IQC-5531
    type: inspection
    name: IQC-5531
    attributes: {stage: dinh_kem, lot: LOT-B, cpk: 0.92, verdict: "Conditionally accepted", spec_min: 1.33}

  # --- Sales / shipping ---
  - {id: SO-7781, type: sales_order, name: SO-7781, attributes: {stage: khach_hang}}
  - {id: SO-7790, type: sales_order, name: SO-7790, attributes: {stage: khach_hang}}
  - {id: CUS-C1, type: customer, name: "Customer C1", attributes: {stage: khach_hang}}
  - {id: CUS-C3, type: customer, name: "Customer C3", attributes: {stage: khach_hang}}
  - {id: CUS-C5, type: customer, name: "Customer C5", attributes: {stage: khach_hang}}
  - id: SHP-1112
    type: shipment
    name: SHP-1112
    attributes: {stage: logistics, status: delivered, date: "2026-11-12", customer: CUS-C3, parts: 400, boxes: 17}
  - id: SHP-1115
    type: shipment
    name: SHP-1115
    attributes: {stage: logistics, status: delivered, date: "2026-11-15", customer: CUS-C5, parts: 240, boxes: 10}
  - id: SHP-1120
    type: shipment
    name: SHP-1120
    attributes: {stage: logistics, status: in_warehouse, parts: 360, boxes: 15}

aliases:
  - {object_id: M02, system: PLC, local_name: PLC2, approved_by: Quality}
  - {object_id: M02, system: MES, local_name: MC-02, approved_by: Quality}
  - {object_id: M02, system: CMMS, local_name: "Press 2", approved_by: Quality}
  - {object_id: SUP-S1, system: ERP, local_name: SUPPLIER-S1, approved_by: Quality}
  - {object_id: LOT-B, system: SUPPLIER, local_name: S1-6203-B, approved_by: Quality}

# Hand-written links: from, to, relation, tier, status, score (default 1.0), rule_version, evidence
links:
  - {from: CLM-0012, to: MH20-0001, relation: about, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  # MH20-2457 is a hand-written serial from another lot, outside the generator's 0001–1000 range (it has no object of its own).
  - {from: CLM-0011, to: MH20-2457, relation: about, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - from: LOT-B
    to: HOP-1
    relation: fed_into
    tier: 1
    status: confirmed
    score: 1.0
    rule_version: T1-exact
    evidence: {record: ISS-1103, at: "2026-11-03T13:52:00+07:00", valid_from: "2026-11-03T13:52:00+07:00"}
  - from: LOT-A
    to: HOP-1
    relation: fed_into
    tier: 1
    status: confirmed
    score: 1.0
    rule_version: T1-exact
    evidence: {valid_from: "2026-11-03T08:00:00+07:00", valid_to: "2026-11-03T13:52:00+07:00"}
  - {from: HOP-1, to: M02, relation: fed_into, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: LOT-B, to: RCV-2810, relation: received_under, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: RCV-2810, to: PO-4410, relation: received_under, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: LOT-B, to: S1-6203-B, relation: same_as, tier: 2, status: confirmed, score: 0.97, rule_version: T2-alias}
  - {from: S1-6203-B, to: SUP-S1, relation: supplied_by, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: PO-4410, to: SUP-S1, relation: supplied_by, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: IQC-5531, to: LOT-B, relation: inspected, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: IQC-5507, to: LOT-A, relation: inspected, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: LOT-B, to: BRG-6203, relation: part_of, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: CLM-0009, to: SUP-S1, relation: concerns, tier: 3, status: inferred, score: 0.81, rule_version: T3-rule}
  - {from: IQC-5531, to: D-12, relation: specified_by, tier: 4, status: confirmed, score: 0.95, rule_version: T4-doc}
  - {from: D-09, to: CLM-0009, relation: describes, tier: 4, status: confirmed, score: 0.93, rule_version: T4-doc}
  - {from: D-07, to: LOT-B, relation: mentions, tier: 4, status: pending, score: 0.78, rule_version: T4-doc}
  - {from: D-03, to: CLM-0009, relation: similar_to, tier: 5, status: suggested, score: 0.64, rule_version: T5-semantic}
  - {from: SHP-1112, to: SO-7781, relation: ordered_in, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: SO-7781, to: CUS-C3, relation: delivered_to, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: SHP-1115, to: SO-7790, relation: ordered_in, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: SO-7790, to: CUS-C5, relation: delivered_to, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  # Flow bible (spec 3.3): claim links to customer, upstream LOT-A, M02 belongs to LINE-1
  - {from: CLM-0012, to: CUS-C3, relation: raised_by, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: PO-4380, to: SUP-S1, relation: supplied_by, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: RCV-1410, to: PO-4380, relation: received_under, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: LOT-A, to: RCV-1410, relation: received_under, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: M02, to: LINE-1, relation: part_of, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  # Line 2 (MH-25): Hopper 2 feeds Machine 01 and Machine 03 with LOT-C. Nothing links it to LOT-B, so CLM-0012's reach is unchanged.
  - {from: HOP-1, to: LINE-1, relation: part_of, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: HOP-2, to: LINE-2, relation: part_of, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: M01, to: LINE-2, relation: part_of, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: M03, to: LINE-2, relation: part_of, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: HOP-2, to: M01, relation: fed_into, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - {from: HOP-2, to: M03, relation: fed_into, tier: 1, status: confirmed, score: 1.0, rule_version: T1-exact}
  - from: LOT-C
    to: HOP-2
    relation: fed_into
    tier: 1
    status: confirmed
    score: 1.0
    rule_version: T1-exact
    evidence: {valid_from: "2026-11-03T08:00:00+07:00"}

