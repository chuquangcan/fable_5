services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: onethread
      POSTGRES_PASSWORD: onethread
      POSTGRES_DB: onethread
    ports:
      - "5433:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onethread -d onethread"]
      interval: 2s
      timeout: 3s
      retries: 30
